# VASPTrace label-source manifest
#
# This file is the contract behind "never invent VASP addresses". The importer reads only
# what is declared here, and refuses to run if any entry omits its provenance. A label whose
# origin cannot be cited has nowhere to go.
#
# Bump `version` for every import: it is pinned to every trace, so past results stay
# reproducible even after the dataset changes (DPRD §15). Versions are immutable — the
# importer rejects a re-import of an existing version.
#
# Required per source:
#   name             human-readable publisher/dataset name (stored on every row)
#   kind             vasp_addresses | risk_entities
#   url              citable http(s) URL, or file:<path> for a documented synthetic source
#   file             path to the CSV, relative to this manifest
#   tier             official_vasp_published | sanctions_list | community_verified
#                    | community_unverified | demo_unverified
#   licence          the terms the data is used under
#   retrieved        ISO date the file was obtained
# Optional:
#   default_severity risk_entities only: info | low | medium | high
#   notes            anything a reviewer should know
#
# See PROVENANCE.md for what each source is and why its tier was chosen.

version: "2026-09-18.1"

sources:
  # ─────────────────────────────────────────────────────────────────────────────
  # Synthetic demo fixture. Fictional service providers, deterministically derived
  # addresses. Imported ONLY when ALLOW_DEMO_LABELS=true or --allow-demo is passed,
  # and refused outright in production. Cannot support a primary attribution.
  # Regenerate with: python -m app.database.seeds.demo_fixtures
  # ─────────────────────────────────────────────────────────────────────────────
  - name: "VASPTrace synthetic demo fixture (NOT REAL DATA)"
    kind: vasp_addresses
    url: "file:data/labels/PROVENANCE.md#synthetic-demo-fixture"
    file: demo/demo_vasp_addresses.csv
    tier: demo_unverified
    licence: "Generated by this project; no third-party rights"
    retrieved: 2026-09-18
    notes: >-
      Fictional VASPs with synthetic addresses, for development and demo only.
      Not real addresses; not real service providers.

  - name: "VASPTrace synthetic demo fixture (NOT REAL DATA)"
    kind: risk_entities
    url: "file:data/labels/PROVENANCE.md#synthetic-demo-fixture"
    file: demo/demo_risk_entities.csv
    tier: demo_unverified
    licence: "Generated by this project; no third-party rights"
    retrieved: 2026-09-18
    default_severity: medium
    notes: Fictional mixer/bridge/gambling entities for exercising the risk engine.

